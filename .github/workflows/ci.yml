name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: volta-cli/action@v4
      - run: volta install node@22.23.5 pnpm@9.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
